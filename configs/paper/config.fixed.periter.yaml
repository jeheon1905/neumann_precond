# =====================================================================
# Figure S1 and Table S2  --  per-iteration cost
# ---------------------------------------------------------------------
# Damped-NP (order 5) versus ISI, fixed Hamiltonian, no locking.
# The mean and standard deviation of the per-iteration cost need the
# *individual* "[Time: Diag. Iter.]" / "[Time: Preconditioning]" lines,
# which Timer.stop only prints when verbosity >= 1; the aggregate Timer
# Summary carries totals and counts alone and cannot give a sigma.
# do_retHistory stays OFF so the per-iteration times are not inflated,
# and only order 5 is run, so this sweep is small.
#
#   python repeat_test.py --config configs/paper/config.fixed.periter.yaml
# =====================================================================
experiment:
  name: "experiment"
  results_root: "results_paper/fixed.periter"
  density_key_mode: "geom4"

systems:
  roots:
    - "data/systems"
  extensions:
    - "*.cif"
    - "*.sdf"
    - "*.xyz"
  selected:
    - "MAPbI3.cif"           # 3D PBC
    - "B12.sdf"              # Vitamin B12, isolated
    - "water_cluster_128.xyz"
    - "C60_4.xyz"            # C60 tetramer
  defaults:
    supercell: [1, 1, 1]
    pbc: null                # auto-detect from file type
    spacing: 0.2
    nbands: null
  overrides:
    "MAPbI3.cif":
      supercell:
        - [2, 2, 2]
      pbc: [1, 1, 1]

sweep:
  preconds: ["shift-and-invert", "neumann"]
  threads: [1]
  outerorder: [5]
  innerorder: [0]
  pcg_neumann: [5]           # ISI inner PCG iterations (paper: 5)
  error_cutoff: [-0.4]
  averaged_sum: [true]
  weight: [0.5]                 # damping weight alpha = 1/2
  spacing: [0.2]
  nbands: []
  virtual_factor: [1.2]      # +20 % virtual orbitals
  merge_iter: []

neumann:
  res_orders: [2, 6, 10]
  res_thresholds: [1e-0, 1e-1]

calculation:
  mode: "fixed"
  temperature: 0.0           # 0 K
  scf_print_energies: false
  scf_energy_tol: .inf
  scf_density_tol: 1.0e-5
  scf_mixing: "potential"    # Pulay mixing of the potential
  pp_type: "TM"
  filtering: true
  use_cuda: true
  warmup_when_cuda: 1
  virtual_factor: 1.2

  diagonalization:
    iter: null
    tol: null
    scf:
      iter: 21
      tol: null
    fixed:
      iter: 1000
      tol: 1.0e-5            # residual norm of occupied orbitals < 1e-5

  davidson:
    nblock: 2
    locking: false
    fill_block: false

  execution:
    runs_per_combo: 3
    scf_runs_per_combo: 0
    do_retHistory: false
    do_retHistoryScfDir: false
    dry_run: false
    verbosity: 1
    seed: [0, 1, 2]

summary_fields:
  davidson_total:
    candidates: ["davidson", "Davidson.diagonalize", "Davidson diagonalize", "Davidson"]
    attr: "total"
  diag_iter_count:
    candidates: ["Diag. Iter.", "Diag Iter.", "Diag Iter", "SCF iter.", "SCF iter", "SCF iteration"]
    attr: "count"
  preconditioning_total:
    candidates: ["Preconditioning"]
    attr: "total"
  preconditioning_count:
    candidates: ["Preconditioning"]
    attr: "count"
